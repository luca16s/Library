name: "CI"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Realizando checkout do Projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparando .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Restaurando pacotes
        run: dotnet restore
      - name: Construindo projetos
        run: dotnet build -c Release --no-restore
      - name: Rodando testes
        run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput='../coverage/coverage.json'
      - name: Enviando dados de cobertura
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage/coverage.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true
