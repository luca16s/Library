name: "CD"
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Realizando checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparando .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restaurando pacotes
        run: dotnet restore
      - name: Construindo projetos
        run: dotnet build -c Release --no-restore
      - name: Buscando versão e publicando pacote
        run: |
          $tagArray="${{github.ref}}".Split("/")
          $tag=$tagArray[2].Split("v")
          $VERSION=$tag[1]
          dotnet pack -p:PackageVersion=$VERSION --configuration Release --property:PackageOutputPath=..\
          dotnet nuget push "*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/Iakare-Softwareoka-Inc/index.json" --skip-duplicate
