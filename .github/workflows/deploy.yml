name: Core Library CD
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Realizando checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Preparando .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    - name: Restaurando pacotes
      run: dotnet restore
    - name: Construindo projetos
      run: dotnet build -c Release --no-restore
    - name: Buscando versão e publicando pacote
      run: |
        $tagName="${{github.ref}}"
        $array=$tagName.Split("/")
        $VERSION=$array[2]
        dotnet pack --configuration Release --output out p:PackageVersion=$VERSION
        dotnet nuget push "out\*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/luca16s/index.json" --skip-duplicate
